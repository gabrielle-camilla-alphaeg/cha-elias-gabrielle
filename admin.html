<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin · Chá Revelação</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#FAFAF7;color:#2A2A24;font-family:'Inter',sans-serif;padding:32px 20px;min-height:100vh}
h1{font-family:'Cormorant Garamond',serif;font-size:32px;font-weight:400;margin-bottom:4px;color:#2A2A24}
.sub{font-size:12px;color:#6A8878;letter-spacing:.12em;text-transform:uppercase;margin-bottom:32px}
.section{background:#fff;border:1px solid rgba(90,140,106,.12);border-radius:16px;padding:24px;margin-bottom:24px;max-width:560px}
.section h2{font-size:11px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#5A8C6A;margin-bottom:16px}
.stat-row{display:flex;gap:20px;margin-bottom:20px}
.stat{flex:1;background:rgba(90,140,106,.05);border-radius:12px;padding:16px;text-align:center}
.stat-n{font-size:36px;font-weight:600;color:#2A2A24;line-height:1}
.stat-l{font-size:11px;color:#6A8878;margin-top:4px}
.list-item{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid rgba(90,140,106,.07)}
.list-item:last-child{border-bottom:none}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;color:#fff;flex-shrink:0}
.name{font-size:14px;font-weight:500;color:#2A2A24}
.time{font-size:11px;color:#6A8878;margin-top:2px}
.badge{font-size:10px;font-weight:600;padding:3px 8px;border-radius:20px;margin-left:auto;flex-shrink:0}
.badge.m{background:rgba(80,184,112,.12);color:#3A9060}
.badge.f{background:rgba(208,96,144,.12);color:#C04080}
.empty{color:#6A8878;font-size:13px;padding:12px 0;text-align:center}
.btn-refresh{display:inline-flex;align-items:center;gap:6px;background:#5A8C6A;color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:500;cursor:pointer;margin-bottom:24px;max-width:560px;width:100%}
.loading{color:#6A8878;font-size:13px;padding:12px 0;text-align:center;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
</style>
</head>
<body>
<h1>Chá Revelação</h1>
<div class="sub">Elias &amp; Gabrielle · painel admin</div>

<button class="btn-refresh" onclick="carregar()">↻ Atualizar</button>

<div class="section">
  <h2>Resumo</h2>
  <div class="stat-row">
    <div class="stat"><div class="stat-n" id="tot-confirm">–</div><div class="stat-l">confirmações</div></div>
    <div class="stat"><div class="stat-n" id="tot-m">–</div><div class="stat-l">⚽ menino</div></div>
    <div class="stat"><div class="stat-n" id="tot-f">–</div><div class="stat-l">🩰 menina</div></div>
  </div>
</div>

<div class="section">
  <h2>Quem confirmou presença</h2>
  <div id="lista-confirm"><div class="loading">carregando…</div></div>
</div>

<div class="section">
  <h2>Palpites registrados</h2>
  <div id="lista-votos"><div class="loading">carregando…</div></div>
</div>

<script>
const JB_BIN='6ad9018eac6210605a46b4f6';
const JB_KEY='$2a$10$3LhBQXebn6LotV0DzWFMY.9zClLUcUNocwbdxal0t/EuSNqa5X0Gu';
const CORES=['#C85878','#3068A8','#B04070','#2860A0','#5A8C6A','#A82858','#3878A8','#8A3060','#2870A0','#C03878'];
function corAv(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))>>>0;return CORES[h%CORES.length];}
function fmtTs(ts){if(!ts)return'–';var d=new Date(ts);return d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit',year:'2-digit'})+' '+d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});}

async function carregar(){
  document.getElementById('lista-confirm').innerHTML='<div class="loading">carregando…</div>';
  document.getElementById('lista-votos').innerHTML='<div class="loading">carregando…</div>';
  try{
    var r=await fetch('https://api.jsonbin.io/v3/b/'+JB_BIN+'/latest',{headers:{'X-Master-Key':JB_KEY}});
    var d=await r.json();
    var rec=d.record||{};
    var confirmados=Array.isArray(rec.confirmados)?rec.confirmados:[];
    var votos=Array.isArray(rec.votos)?rec.votos:[];

    // stats
    var m=votos.filter(function(v){return v.genero==='menino';}).length;
    var f=votos.filter(function(v){return v.genero==='menina';}).length;
    document.getElementById('tot-confirm').textContent=confirmados.length;
    document.getElementById('tot-m').textContent=m;
    document.getElementById('tot-f').textContent=f;

    // lista confirmações
    var lc=document.getElementById('lista-confirm');
    if(confirmados.length===0){lc.innerHTML='<div class="empty">Nenhuma confirmação ainda.</div>';}
    else{
      confirmados.sort(function(a,b){return(b.ts||0)-(a.ts||0);});
      lc.innerHTML=confirmados.map(function(c){
        var ini=(c.nome||'?')[0].toUpperCase();
        return '<div class="list-item"><div class="av" style="background:'+corAv(c.nome||'?')+'">'+ini+'</div><div><div class="name">'+escHtml(c.nome||'–')+'</div><div class="time">'+fmtTs(c.ts)+'</div></div></div>';
      }).join('');
    }

    // lista votos
    var lv=document.getElementById('lista-votos');
    if(votos.length===0){lv.innerHTML='<div class="empty">Nenhum palpite ainda.</div>';}
    else{
      votos.sort(function(a,b){return(b.ts||0)-(a.ts||0);});
      lv.innerHTML=votos.map(function(v){
        var ini=(v.display||'?')[0].toUpperCase();
        var badge=v.genero==='menino'?'<span class="badge m">Menino ⚽</span>':'<span class="badge f">Menina 🩰</span>';
        return '<div class="list-item"><div class="av" style="background:'+corAv(v.display||'?')+'">'+ini+'</div><div><div class="name">'+escHtml(v.display||'–')+'</div><div class="time">'+fmtTs(v.ts)+'</div></div>'+badge+'</div>';
      }).join('');
    }
  }catch(e){
    document.getElementById('lista-confirm').innerHTML='<div class="empty">Erro ao carregar.</div>';
    document.getElementById('lista-votos').innerHTML='<div class="empty">Erro ao carregar.</div>';
  }
}

function escHtml(s){var d=document.createElement('div');d.textContent=s;return d.innerHTML;}
carregar();
</script>
</body>
</html>
